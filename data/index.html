<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Climate Control Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="topnav">
        <h1><i class="fas fa-temperature-half"></i> Climate Control Dashboard</h1>
    </div>

    <div class="content">
        <div class="card-grid">
            <!-- AC Control Card -->
            <div class="card">
                <p class="card-title">
                    <i class="fas fa-power-off"></i>
                    Air Conditioner Control
                </p>
                <div style="text-align: center; margin: 20px 0;">
                    <a href="/on"><button class="button-on"><i class="fas fa-power-off"></i> Turn ON</button></a>
                    <a href="/off"><button class="button-off"><i class="fas fa-power-off"></i> Turn OFF</button></a>
                </div>
                <div class="state">
                    <span class="status-indicator status-on"></span>
                    Status: <span class="value">%AC_STATE%</span>
                </div>
            </div>

            <!-- Status Card -->
            <div class="card">
                <p class="card-title">
                    <i class="fas fa-chart-line"></i>
                    System Status
                </p>
                <div id="status-info" style="color: var(--text-secondary); line-height: 2;">
                    <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border);">
                        <span><i class="fas fa-thermometer-half"></i> Temperature:</span>
                        <span class="value" id="temp">--°C</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border);">
                        <span><i class="fas fa-fan"></i> Fan Speed:</span>
                        <span class="value" id="fan">--</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 8px 0;">
                        <span><i class="fas fa-gauge"></i> Mode:</span>
                        <span class="value" id="mode">--</span>
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: center;">
                    <button class="button-secondary" onclick="updateStatus()">
                        <i class="fas fa-rotate"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Console Card -->
            <div class="card">
                <p class="card-title">
                    <i class="fas fa-terminal"></i>
                    System Console
                </p>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">
                    View real-time logs and debug information
                </p>
                <a href="/console">
                    <button class="button-secondary" style="width: 100%;">
                        <i class="fas fa-terminal"></i> Open Console
                    </button>
                </a>
            </div>

            <!-- Firmware Card -->
            <div class="card">
                <p class="card-title">
                    <i class="fas fa-microchip"></i>
                    Firmware Management
                </p>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">
                    Current Version: <span class="value">%VERSION%</span>
                </p>
                <a href="/update">
                    <button class="button-secondary" style="width: 100%;">
                        <i class="fas fa-download"></i> Update Firmware
                    </button>
                </a>
            </div>
        </div>
    </div>

    <script>
        function updateStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('temp').textContent = data.temp + '°C';
                    document.getElementById('fan').textContent = data.fan;
                    const modes = ['AUTO', 'COOL', 'DRY', 'HEAT', 'FAN'];
                    document.getElementById('mode').textContent = modes[data.mode] || 'Unknown';
                })
                .catch(err => console.error('Status update failed:', err));
        }
        
        // Auto-update every 10 seconds
        setInterval(updateStatus, 10000);
        updateStatus();
    </script>
</body>
</html>
